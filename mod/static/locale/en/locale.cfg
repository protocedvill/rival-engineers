[mod-setting-description]
rival-engineers-faction-count=Number of AI factions created on a new map.
rival-engineers-crew-size=Number of engineer characters in each AI faction.
rival-engineers-controller-steps-per-tick=Per-tick budget: the most character controllers stepped in one tick. Controllers beyond it are stepped round-robin on later ticks.
rival-engineers-stuck-ticks=A walking engineer that gets no closer to its next waypoint for this many ticks is stuck and re-paths.
rival-engineers-max-repaths=How many times a walk may re-path (after getting stuck or reaching the path end short of the goal) before it fails.
rival-engineers-action-stall-ticks=Mining, crafting and pick-up fail if they make no progress for this many ticks.
rival-engineers-debug-teleport-when-stuck=Breaks player parity. For debugging only.
rival-engineers-debug-instant-craft=Breaks player parity. For debugging only.
rival-engineers-debug-reach-multiplier=Breaks player parity. Multiplies the crew's build, reach and resource reach distances. 1 = vanilla. For debugging only.
rival-engineers-job-max-attempts=A job that fails this many times (blocked placement, missing materials...) is marked failed with a reason instead of being retried.
rival-engineers-job-retry-ticks=After a failed attempt a job waits this long before it can be claimed again. The wait doubles with each attempt.
rival-engineers-batch-max-jobs=The most jobs a crew member claims at once when it batches nearby placements from one standing spot.
rival-engineers-job-blocked-retry-ticks=A placement blocked only by a character standing in the way is retried after this many ticks, without counting as a failed attempt.
rival-engineers-place-delay-ticks=How long an engineer takes to place one entity once it is in reach, like a player moving the cursor and clicking. 0 = instant.
rival-engineers-belt-place-delay-ticks=Like the placement delay, for belts, which players drag-place faster.
rival-engineers-research-science-packs=Comma-separated science packs. The research goal is every technology researched with only these packs (and allowed trigger technologies), read from prototypes.
rival-engineers-research-excluded-triggers=Comma-separated items, entities or fluids. Trigger technologies that need one of them, and everything behind them, are left out of the research goal.
rival-engineers-auto-spawn=Create the configured number of AI factions on the first tick of a new map. Never happens while factorio-test runs.
rival-engineers-spawn-mode=auto-distance: a spot with starting resources at least the minimum distance from players and other factions. fixed-offsets: the listed offsets from the player spawn. scenario-defined: only factions created through the remote interface.
rival-engineers-spawn-min-distance=auto-distance: minimum distance from the player spawn, players and other factions.
rival-engineers-spawn-resource-radius=auto-distance: iron, copper, coal and stone must all lie within this radius of a spawn.
rival-engineers-spawn-fixed-offsets=fixed-offsets: x,y offsets from the player spawn, separated by semicolons, one per faction.
rival-engineers-spawn-starting-area=auto-distance: register each faction's spawn as a map-generation starting point before its surroundings are generated (as the PvP scenario does for teams), so it gets starting-area resources like a player. Falls back to searching generated land when no ungenerated spot is left.
rival-engineers-spawn-water-radius=With a starting area: a spawn needs water within this radius, else the next spot is tried (0 = no water check). The starting-lake repair works in this radius too.
rival-engineers-spawn-lake-repair=With a starting area: when the spawn's tiles were generated before its starting point was registered (the engine pre-generates a wide area around the origin when a new game starts), the starting lake is missing. Repaint water where the map's own elevation noise puts it.
rival-engineers-spawn-lake-repair-min-tiles=Repair only when at least this many tiles near the spawn are land although the elevation noise makes them water (a correctly generated spawn differs in a handful of shore tiles).
rival-engineers-scan-radius=Chunks within this radius of a faction's base are generated, as a player exploring would, and scanned for resource patches. Crew don't chart.
rival-engineers-brain-interval-ticks=How often each faction's strategy layer re-evaluates its goals.
rival-engineers-bootstrap-sites=Burner drills to build per resource during the burner bootstrap, as resource=count pairs.
rival-engineers-first-electricity-items=The burner bootstrap is done when the faction holds these items, as item=count pairs.
rival-engineers-stall-ticks=No planner progress for this many ticks is a stall: it is logged with a reason and the faction replans. 54000 = 15 game-minutes.
rival-engineers-telemetry-interval-ticks=Write telemetry JSON to script-output every this many ticks. 0 = off.
rival-engineers-frame-dump-interval-ticks=Write entity frame dumps for tools/render every this many ticks. 0 = off.
rival-engineers-frame-dump-radius=Radius around each faction's base covered by frame dumps.
rival-engineers-factory-enabled=Once a faction has gathered the first-electricity materials, the recipe-graph planner takes over: it designs the factory for the target, places and routes modules, plans power, and has the crew build it.
rival-engineers-factory-targets=Science packs per minute the labs should consume, as item=count pairs separated by commas. Stages are separated by semicolons; the planner builds for the current stage and leaves headroom for the next.
rival-engineers-factory-region-radius=Modules are placed within this distance of the faction's hub. A plan that fails is retried with a larger region.
rival-engineers-factory-entities=role=entity pairs: assembler, electric-drill, lab, boiler, engine, pole.
rival-engineers-factory-research-unit-time=The lab array is sized so its labs consume the target at this research unit time. 0 = the mean unit time of the research goal's pack technologies.
rival-engineers-factory-design-margin=The factory is designed for each stage target times this factor, so the measured science rate reaches the target.
rival-engineers-factory-lab-sizing=Per stage (separated by semicolons; the last repeats): the research unit time labs are sized for. mean or max over the research goal's pack technologies, or seconds. Overridden by the research unit time setting when it is above 0.
rival-engineers-build-stuck-rounds=A build whose leftover ghosts placed nothing for this many rounds (30 s apart) gives up its location and is planned elsewhere; a stuck growth is abandoned. 0 = never.
rival-engineers-factory-power-fuel-minutes=A steam block's fuel producer whose drills have less than this many minutes of ore left (at its planned rate), or none, is deconstructed and planned again on fresh ore; the crew keeps the boilers fuelled meanwhile. 0 = never (D28). Proposed (P36 a).
rival-engineers-factory-fuel-fallback=When a new fuel producer (coal outpost) cannot be placed, its consumers tap the nearest built producer of that fuel through splitters, and that producer grows. Proposed (P36 b).
rival-engineers-factory-radar=Once its power is built, a faction places one radar at its base, like a player would. Plans still use the chunks the planner explores; the radar is for the look of the base (D56).
rival-engineers-logistics-share-min-modules=Research splitters before production when sharing providers through splitter taps saves at least this many modules (0 = never).
rival-engineers-factory-shared-providers=From this stage on (1 = the first; 0 = never), and once splitters can be built, providers are shared through splitter taps: new consumers tap a producer with spare capacity (the steam block's coal outpost included), else share one new producer per production cluster.
rival-engineers-factory-sustain-minutes=The last stage's target counts as reached once the labs consumed at least that rate of every pack over this many game minutes.
rival-engineers-factory-hand-feed-labs=Until a science pack is automated, the crew hand-craft it and put it into the labs so research that unblocks the factory can proceed.
rival-engineers-conflict-max-repairs=How many times a goal reroutes a belt or moves its modules elsewhere because something it does not own (another faction, a player) took their ground. After that, its blocked ghosts are only retried. 0 = never.
rival-engineers-factory-build-priority=Job Board priority of the factory's place and clear jobs. The bootstrap uses fuel 100, place 90, transfer 60, craft 50 and gather 20.
rival-engineers-factory-mall=Curated module built once science is automated. The crew take buildings from its output chests instead of hand-crafting them. Empty = no mall.
rival-engineers-factory-mall-utilization=The mall only runs while its chests have room: its plate flows are planned at this fraction of its full-speed demand.
rival-engineers-soak-done-milestone=Telemetry writes done.json, which ends a soak run, once every faction has reached this milestone (e.g. automated-red-science).
rival-engineers-sandbox-enemies=Only in the "Rival Engineers sandbox" scenario. Off: no enemy bases, peaceful mode.
rival-engineers-trip-max-jobs=Clearing an area or cutting wood: a crew member chains this many nearby tree, rock and pick-up jobs into one trip before going back to the depot. 1 = a depot round trip per job.
rival-engineers-trip-radius=Every job of a mining trip lies within this many tiles of the first one.
rival-engineers-trip-inventory-fill=A mining trip stops taking jobs when their products would fill more than this fraction of the crew member's free inventory slots.
rival-engineers-bootstrap-depletion-minutes=A bootstrap mining site whose drill has less than this many minutes of ore left gets a replacement on remaining ore; the old site is picked up once the new one is built (D43). 0 = only when empty.
rival-engineers-layout-smelting=compact-core: smelters next to the rest of the factory, ore belted in; near-ore: smelters next to their ore patch, plates belted in. Empty = the layout policy's own choice (compact-core).
rival-engineers-measure-interval-ticks=Every this many ticks the states and output counters of every built module are sampled (Factory Graph measurement).
rival-engineers-measure-window-samples=Measured rates and states are averaged over this many samples (a sliding window).
rival-engineers-measure-probe-ticks=A belt edge's flow is measured by watching the belt tile at its consumer's port for this many ticks, one edge at a time per faction.
rival-engineers-reconcile-remedies=The reconciler classifies modules (ok, starved, backed up, unpowered, unfuelled) and traces root causes; on: it also grows undersized producers, repairs broken belts and pole lines and refuels crew-fuelled burners.
rival-engineers-reconcile-warmup-ticks=A module is classified only this long after it and the modules feeding it were built.
rival-engineers-reconcile-confirm=A module's status changes only after the new status held for this many evaluations in a row.
rival-engineers-reconcile-shortfall=A module whose measured output is below plan by more than this fraction is short.
rival-engineers-reconcile-cooldown-ticks=Ticks between two remedies for the same root cause.
rival-engineers-reconcile-max-remedies=Most remedies for one root cause (after that it only shows in the reports).
rival-engineers-logistics-underground-min-saving=Research the technology that unlocks underground belts before a production or mall plan when routing that plan with undergrounds is at least this many belt tiles shorter (D36). 0 = off (a plan that cannot be routed without them still researches it).
rival-engineers-logistics-splitter-min-saving=Research the technology that unlocks splitters first when one producer feeding several consumers through splitters is at least this many belt tiles shorter than separate producers and belts (D36). 0 = off.
rival-engineers-planner-compare-work-factor=Each of those comparisons may use at most this many times the plan's own routing work (it reroutes the same placement; placement is not repeated).
rival-engineers-planner-placement-soft-claim=Placement cost per footprint tile on another expandable module's growth area (D48 soft claims, D50). 0 = no soft claims for placement.
rival-engineers-planner-router-soft-claim=Router cost per belt tile on another expandable module's growth area (D48 soft claims, D50).
rival-engineers-planner-router-bundle-factor=Cost factor of a belt tile next to another route's belt (B7, D50): below 1 bundles routes together; 1 = off.
rival-engineers-planner-placement-growth-band=Placement cost per footprint tile on the near part of another expandable module's growth area, its direct partners included (B26). Adds to the soft-claim weight. 0 = off.
rival-engineers-planner-placement-growth-band-units=How many growth units next to an expandable module count as its near growth band (B26).
rival-engineers-planner-pole-evict-cost=Placement and routing cost per tile of a pole line that a new module, route or growth takes. The line is picked up and the modules it powered are joined again by a new line (B37). 0 = free.
rival-engineers-planner-placement-growth-blocked=Placement cost per growth unit an expandable module could not grow by at a candidate site: ore, other modules, routes, reservations or claims in its own growth area (B26). 0 = off.
rival-engineers-planner-placement-new-field=A new mine ranks the ore patches it may use by distance; a patch where the faction has no mine yet counts this many tiles farther, so mines stay on fields already in use (D57).
rival-engineers-planner-compare-min-work=Each D36 comparison may use at least this many planner work units, whatever the plan's own routing work (D50).
rival-engineers-logistics-splitter-compare=Compare production plans with splitter taps (B2, D36) and research splitters first when they save enough belt (D50: off by default; the underground comparison is separate).
rival-engineers-module-buffer=Chest entity for module buffer depots (D42): smelter columns put some of their plates into it for the crew to collect. Empty = no buffers.
rival-engineers-module-buffer-slots=Usable slots of a module buffer chest (D42): it stops taking from the line once these are full.
rival-engineers-bootstrap-factories=Once assemblers are available, the faction builds chest-fed assembler cells for these products (item=count), feeds them by hand and deconstructs each once the mall (or automated science, for packs) covers its product. Empty = none.
rival-engineers-bootstrap-factory-wait-seconds=The crew waits for at most this many seconds of a temporary factory's output before hand-crafting the rest (D38).
rival-engineers-crew-background-crafts=Craft jobs a crew member queues before other work and lets run while walking and working (D38: opportunistic hand-crafting). 0 = craft standing at the depot.
rival-engineers-preempt-fuel-seconds=A refuel job pulls the nearest busy crew member off its work only when the running machine has less than this many seconds of fuel left. Otherwise it waits for the next crew member who plans. 0 = never.
rival-engineers-supply-radius=When a job needs an item, the crew takes it straight from the depot or from supply points (bootstrap furnace outputs and chests, surplus coal in drill pairs, the factory's output chests, module buffers) within this many tiles of the faction's hub, before anything is hand-mined or hand-crafted. 0 = any distance.
rival-engineers-supply-min-take=A supply point holding fewer of an item than this is not worth the walk and does not count as available (the depot always does).
rival-engineers-supply-module-furnaces=Smelter modules' furnace outputs count as supply points (after buffers and bootstrap furnaces). Taking from them may starve the module's output belt. Proposed, off by default.

