[mod-setting-name]
rival-engineers-faction-count=AI faction count
rival-engineers-crew-size=Crew size per faction
rival-engineers-controller-steps-per-tick=Controller steps per tick
rival-engineers-stuck-ticks=Stuck detection window (ticks)
rival-engineers-max-repaths=Max re-paths per walk
rival-engineers-action-stall-ticks=Action stall timeout (ticks)
rival-engineers-debug-teleport-when-stuck=Debug: teleport crew when stuck
rival-engineers-debug-instant-craft=Debug: instant crafting
rival-engineers-debug-reach-multiplier=Debug: reach multiplier
rival-engineers-job-max-attempts=Job attempts before failing
rival-engineers-job-retry-ticks=Job retry back-off (ticks)
rival-engineers-batch-max-jobs=Max jobs per locality batch
rival-engineers-job-blocked-retry-ticks=Job retry when blocked (ticks)

[mod-setting-description]
rival-engineers-faction-count=Number of AI factions created on a new map.
rival-engineers-crew-size=Number of engineer characters in each AI faction.
rival-engineers-controller-steps-per-tick=Per-tick budget: the most character controllers stepped in one tick. Controllers beyond it are stepped round-robin on later ticks.
rival-engineers-stuck-ticks=A walking engineer that gets no closer to its next waypoint for this many ticks is stuck and re-paths.
rival-engineers-max-repaths=How many times a walk may re-path (after getting stuck or reaching the path end short of the goal) before it fails.
rival-engineers-action-stall-ticks=Mining, crafting and pick-up fail if they make no progress for this many ticks.
rival-engineers-debug-teleport-when-stuck=Breaks player parity. For debugging only.
rival-engineers-debug-instant-craft=Breaks player parity. For debugging only.
rival-engineers-debug-reach-multiplier=Breaks player parity. Multiplies the crew's build, reach and resource reach distances. 1 = vanilla. For debugging only.
rival-engineers-job-max-attempts=A job that fails this many times (blocked placement, missing materials...) is marked failed with a reason instead of being retried.
rival-engineers-job-retry-ticks=After a failed attempt a job waits this long before it can be claimed again. The wait doubles with each attempt.
rival-engineers-batch-max-jobs=The most jobs a crew member claims at once when it batches nearby placements from one standing spot.
rival-engineers-job-blocked-retry-ticks=A placement blocked only by a character standing in the way is retried after this many ticks, without counting as a failed attempt.
