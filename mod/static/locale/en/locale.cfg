[mod-setting-description]
rival-engineers-faction-count=Number of AI factions created on a new map.
rival-engineers-crew-size=Number of engineer characters in each AI faction.
rival-engineers-controller-steps-per-tick=Per-tick budget: the most character controllers stepped in one tick. Controllers beyond it are stepped round-robin on later ticks.
rival-engineers-stuck-ticks=A walking engineer that gets no closer to its next waypoint for this many ticks is stuck and re-paths.
rival-engineers-max-repaths=How many times a walk may re-path (after getting stuck or reaching the path end short of the goal) before it fails.
rival-engineers-action-stall-ticks=Mining, crafting and pick-up fail if they make no progress for this many ticks.
rival-engineers-debug-teleport-when-stuck=Breaks player parity. For debugging only.
rival-engineers-debug-instant-craft=Breaks player parity. For debugging only.
rival-engineers-debug-reach-multiplier=Breaks player parity. Multiplies the crew's build, reach and resource reach distances. 1 = vanilla. For debugging only.
rival-engineers-job-max-attempts=A job that fails this many times (blocked placement, missing materials...) is marked failed with a reason instead of being retried.
rival-engineers-job-retry-ticks=After a failed attempt a job waits this long before it can be claimed again. The wait doubles with each attempt.
rival-engineers-batch-max-jobs=The most jobs a crew member claims at once when it batches nearby placements from one standing spot.
rival-engineers-job-blocked-retry-ticks=A placement blocked only by a character standing in the way is retried after this many ticks, without counting as a failed attempt.
rival-engineers-place-delay-ticks=How long an engineer takes to place one entity once it is in reach, like a player moving the cursor and clicking. 0 = instant.
rival-engineers-belt-place-delay-ticks=Like the placement delay, for belts, which players drag-place faster.
rival-engineers-research-science-packs=Comma-separated science packs. The research goal is every technology researched with only these packs (and allowed trigger technologies), read from prototypes.
rival-engineers-research-excluded-triggers=Comma-separated items, entities or fluids. Trigger technologies that need one of them, and everything behind them, are left out of the research goal.
rival-engineers-auto-spawn=Create the configured number of AI factions on the first tick of a new map. Never happens while factorio-test runs.
rival-engineers-spawn-mode=auto-distance: a spot with starting resources at least the minimum distance from players and other factions. fixed-offsets: the listed offsets from the player spawn. scenario-defined: only factions created through the remote interface.
rival-engineers-spawn-min-distance=auto-distance: minimum distance from the player spawn, players and other factions.
rival-engineers-spawn-resource-radius=auto-distance: iron, copper, coal and stone must all lie within this radius of a spawn.
rival-engineers-spawn-fixed-offsets=fixed-offsets: x,y offsets from the player spawn, separated by semicolons, one per faction.
rival-engineers-spawn-starting-area=auto-distance: register each faction's spawn as a map-generation starting point before its surroundings are generated (as the PvP scenario does for teams), so it gets starting-area resources like a player. Falls back to searching generated land when no ungenerated spot is left.
rival-engineers-scan-radius=Chunks within this radius of a faction's base are generated, as a player exploring would, and scanned for resource patches. Crew don't chart.
rival-engineers-brain-interval-ticks=How often each faction's strategy layer re-evaluates its goals.
rival-engineers-bootstrap-sites=Burner drills to build per resource during the burner bootstrap, as resource=count pairs.
rival-engineers-first-electricity-items=The burner bootstrap is done when the faction holds these items, as item=count pairs.
rival-engineers-stall-ticks=No planner progress for this many ticks is a stall: it is logged with a reason and the faction replans. 54000 = 15 game-minutes.
rival-engineers-telemetry-interval-ticks=Write telemetry JSON to script-output every this many ticks. 0 = off.
rival-engineers-frame-dump-interval-ticks=Write entity frame dumps for tools/render every this many ticks. 0 = off.
rival-engineers-frame-dump-radius=Radius around each faction's base covered by frame dumps.
rival-engineers-factory-enabled=Once a faction has gathered the first-electricity materials, the recipe-graph planner takes over: it designs the factory for the target, places and routes modules, plans power, and has the crew build it.
rival-engineers-factory-targets=Science packs per minute the labs should consume, as item=count pairs separated by commas. Stages are separated by semicolons; the planner builds for the current stage and leaves headroom for the next.
rival-engineers-factory-region-radius=Modules are placed within this distance of the faction's hub. A plan that fails is retried with a larger region.
rival-engineers-factory-entities=role=entity pairs: assembler, electric-drill, lab, boiler, engine, pole.
rival-engineers-factory-research-unit-time=The lab array is sized so its labs consume the target at this research unit time. 0 = the mean unit time of the research goal's pack technologies.
rival-engineers-factory-hand-feed-labs=Until a science pack is automated, the crew hand-craft it and put it into the labs so research that unblocks the factory can proceed.
rival-engineers-factory-build-priority=Job Board priority of the factory's place and clear jobs. The bootstrap uses fuel 100, place 90, transfer 60, craft 50 and gather 20.
rival-engineers-soak-done-milestone=Telemetry writes done.json, which ends a soak run, once every faction has reached this milestone (e.g. automated-red-science).
