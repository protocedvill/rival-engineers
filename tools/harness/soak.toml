# M3 acceptance soak (SPEC §7 T3, §8 M3): one faction with the default crew on five fixed seeds.
# Every mod setting keeps its default (§5.7) except the telemetry outputs the harness reads.

[run]
name = "m3-one-faction"
seeds = [1, 2, 3, 4, 5]
game_hours = 2.0          # cap per seed; the run stops early once every faction is done
stop_when_done = true

[mapgen]
enemy_bases = false       # D6: v1 maps have no biters

[mod]                     # config overrides (camelCase keys of mod/src/config.ts), applied at map init
factionCount = 1
telemetryIntervalTicks = 3600     # 1 game-minute
frameDumpIntervalTicks = 9000     # 2.5 game-minutes
