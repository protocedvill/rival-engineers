# M6 random 20-seed acceptance sweep (SPEC §3: >= 18/20 random seeds).
# Seeds generated once with Python `secrets` in 1,000,000..9,999,999, excluding the fixed-10 set, then frozen here so
# the run is reproducible. Defaults otherwise; the run stops at v1-done or the 8-game-hour cap.
# Scorecard: python3 tools/harness/m6_scorecard.py out/soak/m6-random20

[run]
name = "m6-random20"
seeds = [8646103, 5387208, 2229258, 7718665, 7587711, 3891760, 5581724, 4819313, 4361783, 7741326, 3088988, 1264816, 2034469, 1376111, 1459426, 8033112, 1677299, 7625436, 6752307, 5480563]
game_hours = 8.0
stop_when_done = true
work_baseline = "tools/harness/baselines/m6-work.json"

[run.fail_fast]
stalls = 2
consecutive_plan_failures = 8
ghost_rounds = 20
exploring_minutes = 60

[run.fail_fast.deadlines]
"automated-red-science" = 1.5
"stage-2" = 3.0
"automated:logistic-science-pack" = 5.0

[mapgen]
enemy_bases = false

[mod]
factionCount = 1
telemetryIntervalTicks = 3600
frameDumpIntervalTicks = 36000
frameDumpRadius = 160
soakDoneMilestone = "v1-done"
